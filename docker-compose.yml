services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-backend
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      JARVIS_DATA_DIR: /data
      JARVIS_DB_PATH: /data/jarvis.db
      JARVIS_LEGACY_DATA_DIR: /legacy/jarvis-data
      HF_SPACE_URL: ${HF_SPACE_URL:-}
    volumes:
      - jarvis_data:/data
      - ./jarvis-data:/legacy/jarvis-data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  jarvis_data:
